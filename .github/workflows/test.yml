name: Test pull requests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test interface
        run: npm test

  publisher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publisher-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test publisher service
        run: npm test
