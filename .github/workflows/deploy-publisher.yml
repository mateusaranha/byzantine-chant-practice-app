name: Deploy publisher service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "publisher-worker/**"
      - ".github/workflows/deploy-publisher.yml"

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: publisher-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: publisher-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test publisher service
        run: npm test
      - name: Deploy publisher service
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: publisher-worker
          secrets: |
            GITHUB_APP_ID
            GITHUB_CLIENT_ID
            GITHUB_INSTALLATION_ID
            GITHUB_CLIENT_SECRET
            GITHUB_PRIVATE_KEY
        env:
          GITHUB_APP_ID: ${{ secrets.PSALTIKON_APP_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.PSALTIKON_CLIENT_ID }}
          GITHUB_INSTALLATION_ID: ${{ secrets.PSALTIKON_INSTALLATION_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.PSALTIKON_CLIENT_SECRET }}
          GITHUB_PRIVATE_KEY: ${{ secrets.PSALTIKON_PRIVATE_KEY }}
