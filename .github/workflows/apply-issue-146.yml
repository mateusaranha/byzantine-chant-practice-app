name: Apply issue 146 implementation

on:
  push:
    branches:
      - issue-146-header-utility-menu

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: issue-146-header-utility-menu

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply focused source changes
        run: python scripts/apply-issue-146.py

      - name: Install interface dependencies
        run: npm ci

      - name: Test interface
        run: npm test

      - name: Install publisher dependencies
        working-directory: publisher-worker
        run: npm ci

      - name: Test publisher service
        working-directory: publisher-worker
        run: npm test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/AppGuide.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Implement compact header utility menu"
          git push origin HEAD:issue-146-header-utility-menu
