name: Apply curated bulk selection migration

on:
  push:
    branches:
      - feat/curated-bulk-hymn-selection
    paths:
      - scripts/apply-curated-bulk.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/curated-bulk-hymn-selection
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Apply migration
        run: node scripts/apply-curated-bulk.mjs
      - name: Test interface
        run: |
          npm ci
          npm test
      - name: Test publisher
        working-directory: publisher-worker
        run: |
          npm ci
          npm test
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CloudLibrary.tsx src/libraryProgressive.css tests/library-progressive.test.mjs publisher-worker/src/index.js publisher-worker/tests/worker.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add bulk hymn selection for curated library"
          git push origin HEAD:feat/curated-bulk-hymn-selection
